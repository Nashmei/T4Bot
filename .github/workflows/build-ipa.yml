name: Build IPA

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unsigned-ipa:
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iPhoneOS application
        run: |
          set -euo pipefail
          xcodebuild             -project T4Bot.xcodeproj             -scheme T4Bot             -configuration Release             -sdk iphoneos             -destination 'generic/platform=iOS'             -derivedDataPath "$RUNNER_TEMP/T4BotDerivedData"             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/T4BotDerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name 'T4Bot.app' -print -quit)"
          test -n "$APP_PATH"
          test -d "$APP_PATH"

          STAGE="$RUNNER_TEMP/T4BotIPA"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/Payload"
          ditto "$APP_PATH" "$STAGE/Payload/T4Bot.app"

          (
            cd "$STAGE"
            /usr/bin/zip -qry "$GITHUB_WORKSPACE/T4Bot-unsigned.ipa" Payload
          )

          test -s "$GITHUB_WORKSPACE/T4Bot-unsigned.ipa"
          shasum -a 256 "$GITHUB_WORKSPACE/T4Bot-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: T4Bot-unsigned-ipa
          path: T4Bot-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

name: T4Bot

options:
  bundleIdPrefix: com.nashmei
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

targets:
  T4Bot:
    type: application
    platform: iOS
    sources:
      - path: T4Bot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nashmei.t4bot
        PRODUCT_NAME: T4Bot
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: T4Bot
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: NO
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - T4BotTests

  T4BotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: T4BotTests
    dependencies:
      - target: T4Bot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nashmei.t4bot.tests
        GENERATE_INFOPLIST_FILE: YES
